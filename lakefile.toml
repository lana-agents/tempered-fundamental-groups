name = "tempered-fundamental-groups"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["TemperedFundamentalGroups"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "TemperedFundamentalGroups"

# Finiteness of the torsion of elliptic curves (`finite_torsion_of_charZero`), used to show that
# the removed set `E[ℓ] + M` of the model orbicurves is a finite (closed) set.
[[require]]
name = "elliptic-curves"
git = "https://github.com/lana-agents/elliptic-curves"
rev = "bebec3fc9f2602e81c83e5236789572a541c85fb"
