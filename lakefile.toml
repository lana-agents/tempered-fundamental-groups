name = "tempered-fundamental-groups"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["TemperedFundamentalGroups"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

# Kummer theory (continuous `H¹`, Kummer maps of curves on the étale fundamental group), for the
# Kummer classes on the tempered fundamental group (`Tempered/Kummer.lean`).
[[require]]
name = "continuous-kummer-theory"
git = "https://github.com/lana-agents/continuous-kummer-theory"
rev = "e3fc64c0b432779995121e138b6f65fc377242c8"

[[lean_lib]]
name = "TemperedFundamentalGroups"

# Finiteness of the torsion of elliptic curves (`finite_torsion_of_charZero`), used to show that
# the removed set `E[ℓ] + M` of the model orbicurves is a finite (closed) set.
[[require]]
name = "elliptic-curves"
git = "https://github.com/lana-agents/elliptic-curves"
rev = "bebec3fc9f2602e81c83e5236789572a541c85fb"

# The étale fundamental group of an affine orbifold `[Spec R / A]` (`Pi1.Orbifold.etalePi1`), its
# fibre-functor topology (`Pi1.Orbifold.FibreAut`) and the coded finite étale algebras
# (`Pi1.Orbifold.EtaleCode`, `SemilinearAut`, `LevelRing`), shared with the `pi1` project.
[[require]]
name = "pi1"
git = "https://github.com/lana-agents/pi1"
rev = "3fedb19347f488773f39dba6b3b20065596a7e4e"

# Serre's finiteness theorem on projective space and Zariski's connectedness theorem for integral
# projective schemes over a complete discrete valuation ring
# (`AlgebraicGeometry.ProjectiveSpace.isPreconnected_closedFibre`), used for
# `SemistableReduction.Statement.zariskiConnected`.
[[require]]
name = "oka"
git = "https://github.com/lana-agents/oka"
rev = "405aadd70a16b05bd1a179a489b2c1c1299df695"

# Formal schemes and Grothendieck existence on `ℙ¹` (chart modules/algebras over `ℙ¹_A`,
# `AdicChartAlgSystem.exists_algebraization`, `ChartModule.flat_of_system`, `AlgStr.toP1`), for the
# algebraization step of the specialization of admissible coverings (M2, Blueprint §12.8).
[[require]]
name = "formal-schemes"
git = "https://github.com/lana-agents/formal-schemes"
rev = "e58ecf04554f14c8d1cc2753136f9d785525df5a"
