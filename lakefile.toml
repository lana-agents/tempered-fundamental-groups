name = "tempered-fundamental-groups"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["TemperedFundamentalGroups"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "TemperedFundamentalGroups"

# Finiteness of the torsion of elliptic curves (`finite_torsion_of_charZero`), used to show that
# the removed set `E[ℓ] + M` of the model orbicurves is a finite (closed) set.
[[require]]
name = "elliptic-curves"
git = "https://github.com/lana-agents/elliptic-curves"
rev = "bebec3fc9f2602e81c83e5236789572a541c85fb"

# The étale fundamental group of an affine orbifold `[Spec R / A]` (`Pi1.Orbifold.etalePi1`), its
# fibre-functor topology (`Pi1.Orbifold.FibreAut`) and the coded finite étale algebras
# (`Pi1.Orbifold.EtaleCode`, `SemilinearAut`, `LevelRing`), shared with the `pi1` project.
[[require]]
name = "pi1"
git = "https://github.com/lana-agents/pi1"
rev = "7647d28f361ba3c9705ed0a179b6a377d461c57a"

# Serre's finiteness theorem on projective space and Zariski's connectedness theorem for integral
# projective schemes over a complete discrete valuation ring
# (`AlgebraicGeometry.ProjectiveSpace.isPreconnected_closedFibre`), used for
# `SemistableReduction.Statement.zariskiConnected`.
[[require]]
name = "oka"
git = "https://github.com/lana-agents/oka"
rev = "b5ab02e971b380a12105570d858fc1d702c796a7"
