version: "v0.4"

project:
  name: "tempered-fundamental-groups"
  description: >-
    A Lean 4 / Mathlib formalization of the tempered fundamental group of an affine orbifold
    [Spec R / A] over a non-archimedean field, built from algebraic integral models instead of
    rigid or Berkovich geometry: tempered coverings are presented by a finite étale level, a
    projective model of the level over the valuation ring, and an equivariant covering space of
    its special fibre. The repository proves the semistable reduction theorem for smooth curves
    in mixed characteristic with perfect residue field (equivariant semistable models over a
    finite Galois extension, following Arzdorf–Wewers), identifies the tempered group with
    André's group read off from semistable models (Theorem A), shows that the tempered group of
    IUT's Tate orbicurves E ∖ (E[ℓ] + M) is not degenerate (Theorem B), and proves Zariski
    connectedness for the special fibres of model codes. It also gives the continuous comparison
    homomorphism to the étale fundamental group of the orbifold.
  authors:
    - "Claude (Anthropic)"
    - "Christian Merten"
    - "LANA Project"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "Tempered fundamental group and metric graph of a Mumford curve"
    authors: ["Emmanuel Lepage"]
    id: "arXiv:0811.3169"
    type: "article"
    location: "§1.1 (the limit formula for the tempered group)"
    relationship: "adapts"
    note: >-
      The definition of the tempered fundamental group follows Lepage's description through
      models; the covering spaces of the special fibres of integral models replace the
      topological coverings of Berkovich spaces (Blueprint.md §1, §2, §7).
    author_endorsement: "not-contacted"
  - title: "Period mappings and differential equations. From ℂ to ℂ_p"
    authors: ["Yves André"]
    type: "book"
    location: "MSJ Memoirs 12 (2003), Chapter III, 2.1.1 and 2.1.5"
    relationship: "adapts"
    note: >-
      André's definition of tempered coverings and of the tempered fundamental group. Theorem A
      identifies the tempered group of this repository with André's group read off from
      semistable models.
    author_endorsement: "not-contacted"
  - title: "Another proof of the semistable reduction theorem"
    authors: ["Kai Arzdorf", "Stefan Wewers"]
    id: "arXiv:1211.4624"
    type: "article"
    relationship: "adapts"
    note: >-
      The proof of the semistable reduction theorem (Gauss-valued trees, local uniformization at
      type 3 and type 4 points, stability at type 3 points, descent) follows this paper, with
      the changes recorded in Blueprint.md §9.
    author_endorsement: "not-contacted"

