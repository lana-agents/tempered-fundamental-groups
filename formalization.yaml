    relationship: "builds-on"
    note: >-
      The étale fundamental group of an affine orbifold (Pi1.Orbifold.etalePi1), its
      fibre-functor topology and the coded finite étale algebras.
  - id: "https://github.com/lana-agents/elliptic-curves"
    relationship: "builds-on"
    note: "Finiteness of torsion of elliptic curves in characteristic 0."
  - id: "https://github.com/lana-agents/oka"
    relationship: "builds-on"
    note: >-
      Serre's finiteness theorem on projective space and Zariski's connectedness theorem
      (AlgebraicGeometry.ProjectiveSpace.isPreconnected_closedFibre).
  - id: "https://github.com/lana-agents/iut"
    relationship: "other"
    note: "Downstream consumer: iut uses Theorem A (andreEquiv') in Iut/Anabelian/TemperedAndre.lean."

classification:
  arxiv: ["math.AG", "math.NT"]
  msc2020: ["14H30", "14G22", "14G20", "11G07"]

status:
  scope: >-
    The tempered fundamental group of affine orbifolds over a valued field via integral models,
    with its comparison map to the étale fundamental group; the semistable reduction theorem
    for smooth curves over complete discretely valued fields of characteristic 0 with perfect
    residue field of positive characteristic; André's identification (Theorem A) under these
    hypotheses; non-degeneracy of the tempered group of IUT's Tate orbicurves in normal form
    (Theorem B); Zariski connectedness for model codes. Everything is proved from Lean's three
    standard axioms. Not covered: non-complete henselian bases, equal characteristic 0 and
    imperfect residue fields for Theorem A, and Weierstrass equations not in Tate normal form
    for Theorem B.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "TemperedFundamentalGroups.SemistableReduction.Statement.strongA"
      file: "TemperedFundamentalGroups/SemistableReduction/StrongAProof.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "TemperedFundamentalGroups.andreEquiv'"
      file: "TemperedFundamentalGroups/Andre/TheoremAFinal.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "TemperedFundamentalGroups.TateOrbicurve.nondegenerate_of_normalForm"
      file: "TemperedFundamentalGroups/Andre/TateRestrictIUT.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "TemperedFundamentalGroups.SemistableReduction.Statement.zariskiConnected"
      file: "TemperedFundamentalGroups/SemistableReduction/ZariskiConnectedProof.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "TemperedFundamentalGroups.temperedToEtale"
      file: "TemperedFundamentalGroups/Tempered/Comparison.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        orchestra for running the agents, taxis for project management, and Claude (Claude Code) as the
        coding agent; Lean/Lake builds with `lake build --wfail`.
      prompting_notes: >-
        Human input consisted of high-level task descriptions and scope decisions.
  notes: >-
    Agents were run with orchestra; project management (issues, status) was done in taxis;
    Claude was the coding agent.

fidelity:
  divergences: >-
    No rigid or Berkovich geometry is used. The topological coverings of the analytification are
    replaced by covering spaces of the special fibres of projective integral models (the formal
    completion along the special fibre has the special fibre as underlying space), and André's
    group (`andreGroup`) is the automorphism group of the fibre functor restricted to coverings
    presented through semistable models; Theorem A identifies the two. The Raynaud–Berkovich
    comparison and André's III.2.1.5 are therefore not formalized as statements about analytic
    spaces (Blueprint.md §1, §4, §10). Theorem A needs a complete base, mixed characteristic and
    a perfect residue field; Theorem B is stated for Weierstrass equations in Tate normal form
    y² + xy = x³ + a₄x + a₆ with ϖ^m ∣ a₄, a₆ = ϖ^m ε, m ≥ 1.

review:
  status: "agent-reviewed"
  reviewers: ["Claude (Anthropic)"]
  notes: >-
    The formalization has only been reviewed by Claude; it has not been reviewed by a human.
    All results are machine-checked by the Lean kernel (axioms as listed under status; checked
    with `#print axioms` on a built checkout of the code at this revision, and the library
    contains no `sorry`).

